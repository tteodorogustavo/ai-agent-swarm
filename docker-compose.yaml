services:
  # API service
  api:
    build: .
    image: ai-agent-swarm:latest
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - rag_data:/code/data
    depends_on:
      - ingest
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
    command: [ "uvicorn", "app.api.main:app", "--host", "0.0.0.0", "--port", "8000" ]

  # One-shot ingestion job to populate the RAG index
  ingest:
    build: .
    env_file:
      - .env
    volumes:
      - rag_data:/code/data
    command: [ "python", "scripts/ingest_data.py" ]
    restart: "no"

volumes:
  rag_data:
